name: SBT CI

on:
  push:
    branches:
      - 'develop'
      - 'master'
      - '!v**'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: global-sbt-cache
      - uses: sbt/setup-sbt@v1
      - name: Setup GPG
        run: |
          echo "$PRIVATE_GPG_KEY" > private.key
          echo "PGP_PASS=$GPG_OPENSOURCE_PASS" >> "$GITHUB_ENV"
          gpg --pinentry-mode loopback --passphrase $GPG_OPENSOURCE_PASS --import private.key
        shell: bash
        env:
          PRIVATE_GPG_KEY: ${{secrets.OSS_PRIVATE_GPG_KEY}}
          GPG_OPENSOURCE_PASS: ${{secrets.OSS_PGP_PASS}}
      - name: Sbt test
        if: ${{github.ref_name != 'master'}}
        run: sbt test
      # Stages a signed bundle on Sonatype Central via the native sbt support
      # (sonaUpload). Deliberately does NOT run sonaRelease - releasing to Maven
      # Central still requires a human to review and publish the staged deployment
      # at https://central.sonatype.com/publishing, same manual gate as before.
      - name: Sbt deploy
        if: ${{github.ref_name == 'master'}}
        run: sbt 'set isSnapshot := false' 'set version := IO.read(new File("VERSION")).mkString.trim' test +publishSigned sonaUpload
        env:
          SONATYPE_USERNAME: ${{secrets.SONATYPE_USERNAME}}
          SONATYPE_PASSWORD: ${{secrets.SONATYPE_PASSWORD}}
